name: CI

on:
  push:
    branches:
      - v3-dev
  pull_request:
    branches:
      - v3

jobs:
  run_tests:
    name: Testing on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: [ 3.10, 3.11, 3.12, 3.13 ]
        include:
          - os: ubuntu-20.04
            python-version: '3.10'
          - os: ubuntu-20.04
            python-version: '3.9'
          - os: ubuntu-20.04
            python-version: '3.8'

          - os: macos-latest
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.8'

          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.9'
          - os: windows-latest
            python-version: '3.8'
    steps:
      - uses: actions/checkout@v4
      - name: Setup python version ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Install dependencies 
        run: python3 -m pip install -r requirements.txt
      - name: Run tests using pytest
        run: pytest pybmrb
      
